[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisptts"
version = "0.9.1"
description = "Modular German Text-to-Speech synthesizer with 28+ TTS engines"
readme = "readme.md"
license = "EUPL-1.2"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25.0",
    "numpy>=1.26.0,<2.0.0",
    # soundfile and pydub are NOT optional: without them the AI-provenance
    # marking required by EU AI Act Art. 50(2) cannot be applied, and CrispTTS
    # fails closed rather than emitting unmarked synthetic audio.
    "soundfile>=0.12.0",
    "pydub>=0.25.1",
    # Container metadata for FLAC/Opus provenance tags.
    "mutagen>=1.47.0",
    # C2PA content credentials, signed by default with the bundled development
    # certificate. Art. 50(2) asks for marking that is *interoperable*; the
    # audio watermark is readable only by Crisp tooling, so a signed C2PA
    # manifest is the layer anyone else's verifier can read. Core, not optional
    # — as an extra it was inactive in every default install.
    "c2pa-python>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "bandit>=1.7.5",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]
# <7.2 computes the Sec-MS-GEC auth token with a scheme Microsoft has
# retired; those versions get a 403 handshake on every request. Measured:
# 7.0.2 fails, 7.2.8 succeeds, same network, same moment.
edge = ["edge-tts>=7.2.0"]
piper = ["piper-tts>=1.2.0"]
ml = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers>=4.46.0",
    "soundfile>=0.12.0",
]
watermark = [
    "audioseal>=0.2.0",
]
watermark-mit = [
    "wavmark>=0.3.0",
]
# Recommended for production: the built-in spread-spectrum watermark is
# imperceptible but does not reliably survive resampling or transcoding
# (measured: 0.94 after embed, 0.63 after a 24k->16k->24k roundtrip, against a
# 0.65 detection threshold). WavMark is MIT-licensed and robust, but pulls in
# torch — hence an extra rather than a core dependency.
robust = [
    "wavmark>=0.3.0",
]
metadata = [
    "mutagen>=1.47.0",
]
# Retained so `pip install crisptts[provenance]` keeps working; C2PA signing is
# part of the core install now, so this adds nothing.
provenance = [
    "c2pa-python>=0.37.0",
]
text-extraction = [
    "pypdfium2>=4.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]

[project.scripts]
crisptts = "main:main_cli_entrypoint"

# Flat layout: package the handlers package plus the core top-level modules.
# Explicit discovery prevents setuptools from tripping over tests/ and local
# scratch dirs (e.g. tts_test_outputs/) during the build.
[tool.setuptools]
py-modules = ["main", "config", "utils", "decoder", "watermark", "chunking", "server", "cache", "ssml",
              "c2pa_dev_cert"]

[tool.setuptools.packages.find]
include = ["handlers*", "crisptts_assets*"]

# The pre-rendered spoken disclosures must ship in the wheel: they are what
# lets Art. 50(4) disclosure work with no TTS backend and no network.
[tool.setuptools.package-data]
crisptts_assets = ["*.flac"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S108", "S603"]  # assert + /tmp paths + subprocess in tests

[tool.bandit]
skips = ["B101"]  # assert used in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
markers = [
    "slow: tests that load heavy ML dependencies (torch, outetts)",
    "live: tests that require the CrispASR binary",
]
